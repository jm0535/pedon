<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>User Guide — Pedon Studio</title>
<meta name="description" content="How to install and use Pedon Studio: describe soil profiles, classify with WRB 2022, use field tools and export data.">
<meta name="theme-color" content="#121216">
<link rel="icon" href="/pedon_logo.png">
<script src="/theme.js"></script>
<style>
:root{--bg:#121216;--card:#1e1e28;--ink:#f0f0f0;--mut:#9a9aa5;--line:#2a2a35;--pri:#5b8def;--nav:rgba(18,18,22,.9);--warnbg:#3a2e15}
:root[data-theme="light"]{--bg:#f8f9fa;--bg2:#f0f1f3;--card:#ffffff;--ink:#1a1a20;--mut:#5a5a65;--line:#e0e0e5;--pri:#4a7de0;--prih:#3a6cd0;--nav:rgba(248,249,250,.9);--warnbg:#fdf3dc}
.theme-btn{background:none;border:1px solid var(--line);color:var(--mut);width:36px;height:36px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;margin-left:12px;flex:none}.theme-btn:hover{color:var(--ink)}.theme-btn svg{width:18px;height:18px}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:72px}
body{background:var(--bg);color:var(--ink);font:16px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--pri)}
nav{position:sticky;top:0;z-index:10;background:var(--nav);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;align-items:center;gap:12px;height:60px}
nav img{width:32px;height:32px;border-radius:6px}
nav b{font-size:14px;letter-spacing:.6px;text-transform:uppercase;flex:1}
nav b a{color:var(--ink);text-decoration:none}
nav .lnk{color:var(--mut);text-decoration:none;font-size:14px;margin-left:16px}
nav .dl{color:#fff;background:var(--pri);padding:8px 14px;border-radius:8px;text-decoration:none;font-size:14px;font-weight:600}
.wrap{max-width:820px;margin:0 auto;padding:0 20px}
main{padding:40px 20px 64px}
h1{font-size:clamp(28px,5vw,40px);line-height:1.2;margin-bottom:16px}
h2{font-size:24px;margin:48px 0 12px;padding-top:24px;border-top:1px solid var(--line)}
h3{font-size:18px;margin:24px 0 8px}
p,ul,ol,table,blockquote{margin:0 0 16px}
ul,ol{padding-left:24px}
li{margin:4px 0}
main>p:first-of-type{color:var(--mut);font-size:18px}
hr{display:none}
code{font:14px ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--card);border:1px solid var(--line);border-radius:4px;padding:1px 6px}
table{width:100%;border-collapse:collapse;font-size:15px;display:block;overflow-x:auto}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.6px}
blockquote{border-left:3px solid #fbbf24;background:var(--warnbg);border-radius:8px;padding:12px 16px;font-size:15px}
.shot{display:flex;flex-wrap:wrap;gap:16px;margin:16px 0 20px}
.shot img{width:min(260px,100%);height:auto;border-radius:14px;border:1px solid var(--line)}
footer{border-top:1px solid var(--line);padding:28px 0;color:var(--mut);font-size:14px;text-align:center}
@media(max-width:560px){nav .lnk{display:none}}
</style>
</head>
<body>
<nav><div class="wrap"><img src="/pedon_logo.png" alt=""><b><a href="/">Pedon Studio</a></b><a class="lnk" href="/">Home</a><a class="lnk" href="/#screenshots">Screenshots</a><a class="dl" href="/#download">Download</a><button id="themeToggle" class="theme-btn" type="button" aria-label="Toggle theme"></button></div></nav>
<main class="wrap">
<!--GUIDE-->
</main>
<footer><div class="wrap">© in4metrix · <a href="https://www.in4metrix.dev">www.in4metrix.dev</a> · <a href="https://github.com/jm0535/pedon">Source code</a></div></footer>
</body>
</html>
