function help(){
A.innerHTML=`<div class='card'><b>Getting started</b><p>Tap <b>+ New</b> to create a profile, describe the horizons at the pit, then tap <b>Save & close</b>.</p><p>Each profile stores: site metadata, horizon descriptions, diagnostic features, photos, and tool results. Everything is saved on this device.</p></div>
<div class='card'><b>Describe a profile</b><ol style='padding-left:20px'><li>Record <b>Site</b> details (GPS, landform, slope, drainage)</li><li>For each <b>Horizon</b>: designation (O/A/E/B/C/R), top/bottom depth, Munsell colour, texture (or sand/silt/clay %), coarse fragments, pH</li><li>Open <b>Laboratory results</b> per horizon for SOC, CEC, EC, CaCO3, gypsum, BD, Fe/Al oxalate & dithionite, phosphate retention, sulfide S</li><li>Tick <b>Diagnostic features</b> observed (gley, vertic, argic, cambic, etc.)</li><li>Attach <b>Photos</b> of profile face and samples</li><li>Run <b>Tools</b> (texture, CEC, carbon stock) and save results to profile</li><li><b>Export</b> PDF, Word, CSV, GeoJSON, or JSON backup</li></ol></div>
<div class='card'><b>WRB 2022 engine</b><p>The app contains 22 diagnostic calculators covering all 32 Reference Soil Groups. After describing a profile, the engine checks key criteria (e.g., argic clay increase, vertic shrink-swell, histic organic thickness) and shows which are <b>met / not met / unknown</b>.</p><p>When enough evidence exists, the engine evaluates <b>principal qualifiers</b> (e.g., Argic, Gleyic, Vertic) and <b>supplementary qualifiers</b> (e.g., Dystric, Skeletic, Humic) and adds depth specs (Epi-/Endo-) to produce a final WRB name like <i>EpiArgic Skeletic Dystric Luvisols</i>.</p><p>When evidence is incomplete, the screen shows <b>INSUFFICIENT EVIDENCE</b> and the next key gate to assess.</p></div>
<div class='card'><b>Diagnostic horizons at a glance</b><table style='width:100%;border-collapse:collapse;font-size:13px'><tr style='background:var(--soft)'><th style='padding:6px;text-align:left'>Horizon</th><th style='padding:6px;text-align:left'>Indicator</th></tr>
<tr><td style='padding:6px'><b>Histic</b></td><td>Organic layer >=40 cm or over rock</td></tr>
<tr><td style='padding:6px'><b>Argic</b></td><td>Clay increase >=3% or >=1.2x in B vs A, >=15 cm thick</td></tr>
<tr><td style='padding:6px'><b>Cambic</b></td><td>Structure/colour change in B, no clay increase</td></tr>
<tr><td style='padding:6px'><b>Vertic</b></td><td>>=30% swelling clay, cracks, slickensides, wedge peds</td></tr>
<tr><td style='padding:6px'><b>Nitic</b></td><td>Polyhedral structure, shiny ped faces, >=30% clay, <=100 cm</td></tr>
<tr><td style='padding:6px'><b>Ferralic</b></td><td>Low weatherable minerals, <=16 cmol/kg clay CEC, >=150 cm</td></tr>
<tr><td style='padding:6px'><b>Andic</b></td><td>Bulk density <=0.9, Al+1/2Fe >=2%, P retention >=85%</td></tr>
<tr><td style='padding:6px'><b>Calcic</b></td><td>>=15% CaCO3 or >=6% more than underlying layer</td></tr>
<tr><td style='padding:6px'><b>Spodic</b></td><td>Dark Bh/Bhs with Al, Fe, OM accumulation</td></tr>
<tr><td style='padding:6px'><b>Plinthic</b></td><td>Fe-rich, redoximorphic, hardens irreversibly</td></tr>
<tr><td style='padding:6px'><b>Salic</b></td><td>ECe >=4 (or >=8 with pH), >=15 cm within 50 cm</td></tr>
<tr><td style='padding:6px'><b>Technic</b></td><td>Artefacts >=80% in >=10 cm layer within 50 cm</td></tr>
<tr><td style='padding:6px'><b>Cryic</b></td><td>Cryic/permafrost horizon <=100 cm (or <=200 cm with alteration)</td></tr>
<tr><td style='padding:6px'><b>Mollic</b></td><td>Dark, base-rich A horizon, >=25 cm thick, BS >=50%</td></tr>
<tr><td style='padding:6px'><b>Umbric</b></td><td>Dark, base-poor A horizon, >=25 cm thick, BS <50%</td></tr>
<tr><td style='padding:6px'><b>Chernic</b></td><td>Very dark, base-rich surface, >=25 cm thick, BS >=50%, from soft parent material</td></tr>
<tr><td style='padding:6px'><b>Gypsic</b></td><td>>=15% gypsum or >=5% more than underlying layer</td></tr>
<tr><td style='padding:6px'><b>Duric</b></td><td>Indurated by silica, >=10 cm thick, cementing agent is opal or microcrystalline silica</td></tr>
<tr><td style='padding:6px'><b>Fluvic</b></td><td>Stratification in >=25% of horizon, >=10 cm thick, from recent alluvial deposition</td></tr>
<tr><td style='padding:6px'><b>Stagnic</b></td><td>Reduction features >=80% of horizon, water stagnation, reducing conditions</td></tr>
</table></div>
<div class='card'><b>Texture calculator</b><p>Enter sand, silt, clay % — the USDA triangle class is computed automatically. If percentages do not sum to 100%, they are normalised and a warning is shown.</p></div>
<div class='card'><b>CEC / base saturation</b><p>Base saturation = (Ca+Mg+K+Na) / CEC x 100. Below 50% = <i>low</i> (acid soils, Dystric), >=50% = <i>high</i> (Eutric). ESP >=15% indicates sodicity. CEC per kg clay below 24 cmol/kg = <i>low-activity clays</i>.</p></div>
<div class='card'><b>Carbon stock</b><p>Stock (Mg/ha) = OC% x BD x depth (cm) x (1 - coarse fragments%). Multi-layer tool sums up to three layers plus optional forest floor. CO2 equivalent uses 3.667x carbon mass.</p></div>
<div class='card'><b>RUSLE erosion</b><p>A = R x K x LS x C x P. LS factor uses slope-class algorithm. Risk classes: Low &lt;5, Moderate 5-15, High 15-50, Very high &gt;50 t/ha/yr.</p></div>
<div class='card'><b>Lime requirement</b><p>Cochrane Al-saturation method: lime (t CaCO3/ha) = 1.8 x (Al - target x (Al+Ca+Mg)). Target Al saturation default 10%. Severe risk when Al saturation &gt;60%.</p></div>
<div class='card'><b>Photos</b><ul><li>Take a vertical photo of the <b>profile face</b> with a colour card and scale bar if possible</li><li>One close-up per diagnostic horizon</li><li>Photos are compressed (max 800 px) on device before storage</li></ul></div>
<div class='card'><b>Exports</b><table style='width:100%;border-collapse:collapse;font-size:13px'>
<tr style='background:var(--soft)'><th style='padding:6px;text-align:left'>Format</th><th style='padding:6px;text-align:left'>Use for</th></tr>
<tr><td style='padding:6px'><b>PDF</b></td><td>Field report, printed record</td></tr>
<tr><td style='padding:6px'><b>Word (.docx)</b></td><td>Edit in Microsoft Word / LibreOffice</td></tr>
<tr><td style='padding:6px'><b>CSV</b></td><td>Excel, R, QGIS, Kobo imports (one row per horizon)</td></tr>
<tr><td style='padding:6px'><b>GeoJSON</b></td><td>QGIS, ArcGIS, web maps (point per profile with elevation)</td></tr>
<tr><td style='padding:6px'><b>JSON backup</b></td><td>Full restore to another device or for archival</td></tr>
<tr><td style='padding:6px'><b>Lab sample list</b></td><td>Sample submission spreadsheet</td></tr>
</table></div>
<div class='card'><b>Offline mode</b><p>The app works completely offline — no internet required after installation. GPS needs device location enabled. All data stays on this device only. Export backups regularly.</p></div>
<div class='card'><b>FAQ</b><details><summary>Why does it say <i>INSUFFICIENT EVIDENCE</i>?</summary><small>The WRB engine needs measured criteria (e.g., clay content for argic, CEC of clay fraction for ferralic) that many field descriptions do not include. The evidence wizard lets you record verified criterion status so the engine can progress.</small></details><details><summary>Can I change the WRB determination manually?</summary><small>No. Final names are produced only from measured evidence. You can, however, record verified criterion status through the evidence wizard.</small></details><details><summary>How do I move profiles to another phone?</summary><small>Export a JSON backup, transfer the file (email, USB, cloud), then open it on the target device and use <b>Merge into this device</b>.</small></details><details><summary>Where is my data stored?</summary><small>On your device. The app uses local storage with a finite capacity (typically 5-10 MB); export backups before it fills.</small></details><details><summary>Is my GPS data private?</summary><small>Yes. Coordinates never leave the device unless you explicitly share or sync. The app has no internet permission.</small></details></div>
<div class='card'><b>References</b><ul><li>IUSS WRB 2022, 4th ed., corrected 24 Sep 2024</li><li>USDA Soil Taxonomy, 13th ed.</li><li>FAO Guidelines for Soil Description (2006)</li><li>Munsell Soil Color Charts</li></ul><small>Check local thresholds before publishing results.</small></div>

function render(){document.querySelectorAll('.sidebar-btn').forEach(b=>b.classList.toggle('on',b.dataset.v===(view==='edit'?'new':view==='tool'?'tools':view==='help'?'help':view)));
 $('#back').style.display=view==='edit'||view==='tool'||view==='list'?'block':'none';
 ({list,edit,exp:exportV,about,tools:toolsV,tool:toolV,help:help})[view]();scrollTo(0,0)}
const go=v=>{view=v;armed=null;render()};

A.addEventListener('input',e=>{const t=e.target,g=t.dataset.g;if(!g||cur==null)return;const k=t.dataset.k,p=P[cur],v=t.type==='checkbox'?t.checked:t.value;
 if(g==='s')p[k]=v;else if(g==='m')p.m[k]=v;else{const h=p.h[+g];if(k.startsWith('lab.')){h.lab=h.lab||{};h.lab[k.slice(4)]=v}else h[k]=v;
  if(['sa','si','cl'].includes(k)){const s=num(h.sa),i=num(h.si),c=num(h.cl);if(s!=null&&i!=null&&c!=null&&Math.abs(s+i+c-100)<=3){h.tx=tex(s,i,c);const el=A.querySelector(`select[data-g="${g}"][data-k="tx"]`);if(el)el.value=h.tx}}
  const sw=$('#sw'+g);if(sw)sw.style.background=col(h)}
 save();res()});

A.addEventListener('click',e=>{const t=e.target,p=P[cur];
 const d=t.closest('[data-del]');if(d){const i=+d.dataset.del;if(armed===i){tomb(P[i]);P.splice(i,1);armed=null;save()}else armed=i;return list()}

 const rh=t.closest('[data-rh]');if(rh){p.h.splice(+rh.dataset.rh,1);save();return edit()}
 const id=t.id;
 if(id==='add'){P.unshift(newP());cur=0;save();go('edit')}

 else if(id==='done')go('list');
 else if(id==='gps'){const m=$('#gm');m.textContent='Locating…';if(!navigator.geolocation){m.textContent='GPS unavailable. Type coordinates.';return}
  navigator.geolocation.getCurrentPosition(q=>{p.lat=q.coords.latitude.toFixed(6);p.lon=q.coords.longitude.toFixed(6);p.acc=Math.round(q.coords.accuracy);if(q.coords.altitude!=null&&!p.elev)p.elev=Math.round(q.coords.altitude);save();edit()},()=>{m.textContent='Could not get a fix. Check location permission or type coordinates.'},{enableHighAccuracy:true,timeout:30000})}
 else if(id==='dpdf')dl('soil-report-'+D()+'.pdf',async()=>{await hyd();return mkPDF(blocks())});else if(id==='ddoc')dl('soil-report-'+D()+'.docx',async()=>{await hyd();return mkDOCX()});else if(id==='dcsv')dl('soil-profiles-'+D()+'.csv',()=>String.fromCharCode(65279)+CSVT);else if(id==='dgeo')dl('soil-profiles-'+D()+'.geo.json',geo);else if(id==='dsmp')dl('lab-samples-'+D()+'.csv',smp);else if(id==='dbak')dl('soil-backup-'+D()+'.json',()=>JSON.stringify(P));else if(id==='cpc'||id==='cpj'){const txt=id==='cpc'?$('#ex').value:JSON.stringify(P);const m=$('#em');
  (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>m.textContent='Copied.').catch(()=>{const x=$('#ex');x.value=txt;x.select();m.textContent='Select all and copy manually.'})}
 else if(id==='shr'){if(navigator.share)navigator.share({title:'Soil profiles',text:$('#ex').value}).catch(()=>{});else $('#em').textContent='Sharing not supported here. Use Copy.'}
 else if(id==='rst'){try{const a=JSON.parse($('#imp').value);if(!Array.isArray(a))throw 0;mrg(a);save();$('#em').textContent='';go('list')}catch(x){alert('Invalid JSON backup.')}}});

document.querySelector('.sidebar-items').addEventListener('click',e=>{const b=e.target.closest('.sidebar-btn');if(!b)return;

 if(b.dataset.v==='new'){P.unshift(newP());cur=0;save();go('edit')}else go(b.dataset.v)});
