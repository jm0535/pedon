name: Build APK

on:
  workflow_dispatch:  # Allow manual trigger from GitHub Actions tab
  push:
    branches: [ main ]

jobs:
  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Verify recent changes in source
        run: |
          echo "Checking for in4metrix attribution..."
          grep -c "in4metrix" app/src/main/assets/index.html
          echo "Checking for Help tab..."
          grep -c 'data-v="help"' app/src/main/assets/index.html
          echo "Checking for onboarding..."
          grep -c "pedon_onboarded" app/src/main/assets/app.js

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify APK contents
        run: |
          APK=$(find app/build/outputs/apk/debug -name "Pedon-Studio-*.apk" | head -1)
          echo "APK found: $APK"
          echo "Size: $(du -h $APK | cut -f1)"
          echo "Checking in4metrix in APK..."
          unzip -p "$APK" assets/index.html | grep -c "in4metrix" || true
          echo "Checking Help tab in APK..."
          unzip -p "$APK" assets/index.html | grep -c 'data-v="help"' || true

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pedon-Studio-Debug-APK
          path: app/build/outputs/apk/debug/Pedon-Studio-*.apk
          retention-days: 90
